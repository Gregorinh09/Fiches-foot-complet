w.innerHTML=`<b>Sauvegarde et export</b><p style="margin:4px 0 8px;font-size:14px;color:var(--mu)">${c.j} joueur(s) · ${c.f} fiche(s) enregistrée(s) · ${c.s} séance(s) suivie(s). Dernière sauvegarde : ${le?new Date(le).toLocaleDateString("fr-FR"):"jamais"}. Les données restent dans ce navigateur : exporte-les régulièrement.</p>`;
const mk=(t,f,cl)=>{const e=document.createElement("button");e.textContent=t;if(cl)e.className=cl;e.onclick=f;return e},mark=()=>{try{localStorage.setItem(KE,new Date().toISOString())}catch(e){}};
const ta=document.createElement("textarea");ta.rows=3;ta.setAttribute("aria-label","Sauvegarde au format texte");ta.placeholder="Sauvegarde en texte : copie-la ici, ou colle une sauvegarde à importer";ta.style.cssText="width:100%;font:inherit;font-size:12px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px;margin-top:8px";
const fi=document.createElement("input");fi.type="file";fi.accept=".json,application/json";fi.setAttribute("aria-label","Fichier de sauvegarde");fi.style.marginTop="8px";
fi.onchange=()=>{const f=fi.files&&fi.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{ta.value=r.result;toast("Fichier chargé : choisis Fusionner ou Remplacer")};r.readAsText(f)};
const imp=mode=>()=>{try{bkApply(JSON.parse(ta.value.trim()),mode);panel();render();renderEff();renderJr();refBk();toast(mode=="rep"?"Sauvegarde importée : données remplacées":"Sauvegarde importée : données fusionnées")}catch(e){toast("Sauvegarde invalide")}};
const r1=document.createElement("div"),r2=document.createElement("div");r1.className=r2.className="row3";
r1.append(mk("Exporter un fichier",async()=>{const t=JSON.stringify(bkAll(),null,1),fn="sauvegarde-circuit-"+dstr(new Date())+".json";let ok=false;try{const dl=window.claude&&await window.claude.use("downloads");if(dl){await dl.save({filename:fn,data:t});ok=true}}catch(e){if(e&&e.code=="declined")return}if(!ok){try{const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([t],{type:"application/json"}));l.download=fn;document.body.appendChild(l);l.click();l.remove();ok=true}catch(e){}}ta.value=t;if(ok){mark();toast("Sauvegarde exportée")}else toast("Export de fichier indisponible ici : copie le texte ci-dessous")}),mk("Copier en texte",()=>{ta.value=JSON.stringify(bkAll());ta.select();try{navigator.clipboard.writeText(ta.value)}catch(e){}mark();toast("Sauvegarde copiée : colle-la dans un message ou un fichier")},"g"));
let arm=0;const rep=mk("Remplacer toutes les données",()=>{if(!arm){arm=1;rep.textContent="Confirmer : tout sera remplacé";setTimeout(()=>{arm=0;rep.textContent="Remplacer toutes les données"},5000);return}arm=0;imp("rep")()},"g");
r2.append(mk("Fusionner avec les données actuelles",imp("mer"),"g"),rep);
const lb=document.createElement("small");lb.textContent="Importer : choisis un fichier de sauvegarde, ou colle son contenu ci-dessus.";lb.style.cssText="display:block;margin-top:8px;color:var(--mu)";
w.append(r1,ta,lb,fi,r2);return w}
try{refBk()}catch(e){}
setTimeout(()=>{const c=bkCount();let le=null;try{le=localStorage.getItem(KE)}catch(e){}if(c.j+c.f+c.s>0&&(!le||Date.now()-new Date(le)>14*864e5))toast("Pense à sauvegarder tes données : bouton « Exporter ».")},2500);
function chip(l,v){return `<div><i>${l}</i><b>${esc(v)}</b></div>`}
function render(){
const n=S.sl.filter(c=>c.e>=0).length;
$("sheet").innerHTML=`<div class="sh"><div><div class="k">R1 · Prévention blessures</div><h1>${esc(S.t)}</h1><div class="s">${esc(S.p)}</div></div>
<div class="ch">${chip("Durée",S.dur)}${chip("Récupération",S.rec)}${chip("Moment",S.qd)}${chip("Exercices",n+" exercice"+(n>1?"s":""))}</div></div>
${(()=>{const act=[0,1,2,3,4,5].filter(i=>S.sl[i].e>=0),m=act.length,SP=[[6],[6],[3,3],[2,2,2],[3,3,3,3],[2,2,2,3,3],[2,2,2,2,2,2]][m],K=[1,1.7,1.5,1.3,1.25,1,1][m];return `<div class="gr" style="--k:${K};grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(${m>3?2:1},1fr)">${m?act.map((i,j)=>card(i,j,SP[j])).join(""):'<div class="cd empty" style="grid-column:span 6">Choisis au moins un exercice</div>'}</div>`})()}
<div class="sf"><div${S.nt?' style="font-size:12px;line-height:1.25"':""}>${S.nt?"<b>Protocole de réhabilitation</b> · "+esc(S.nt):"<b>Qualité avant quantité</b> · Douleur aiguë : on arrête et on prévient le staff · Exercices unipodaux : des deux côtés"}</div><em>${esc(S.club)}</em></div>`;
try{localStorage.setItem("circuit-fiche",JSON.stringify(S))}catch(e){}}
function fit(){
const w=$("pv").clientWidth,k=Math.min(1,w/1123);
$("sheet").style.transform=`scale(${k})`;$("stage").style.width=1123*k+"px";$("stage").style.height=794*k+"px"}
$("rst").onclick=()=>{S=def();panel();render()};
$("prt").onclick=()=>{try{window.print()}catch(e){}};
panel();render();fit();
if(window.ResizeObserver)new ResizeObserver(fit).observe($("pv"));else addEventListener("resize",fit);
if("serviceWorker" in navigator&&location.protocol.indexOf("http")==0)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
</script>
</body>
